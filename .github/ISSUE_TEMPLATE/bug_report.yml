name: Bug report
description: Report something that is broken or incorrect
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Before posting, please check:

        - [ROADMAP.md](https://github.com/josenimo/histo/blob/main/ROADMAP.md) — the pipeline is at `0.1.0dev` and much of it is deliberately not built yet
        - [Nextflow troubleshooting](https://www.nextflow.io/docs/latest/troubleshooting.html)
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: command_used
    attributes:
      label: Command used and terminal output
      description: Steps to reproduce the behaviour. Please paste the command you used to launch the pipeline and the output from your terminal.
      render: console
      placeholder: |
        $ nextflow run ...

        Some output where something broke

  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: |
        Please drag and drop the relevant files here. Create a `.zip` archive if the extension is not allowed.
        Your verbose log file `.nextflow.log` is often useful _(this is a hidden file in the directory where you launched the pipeline)_ as well as custom Nextflow configuration files.

  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        * Nextflow version _(eg. 23.04.0)_
        * Hardware _(eg. HPC, Desktop, Cloud)_
        * Executor _(eg. slurm, local, awsbatch)_
        * Container engine: _(e.g. Apptainer, Singularity, Docker, Conda)_
        * OS _(eg. Rocky Linux, macOS, Ubuntu)_
        * Version of josenimo/histo _(eg. 0.1.0dev, or the commit SHA)_
