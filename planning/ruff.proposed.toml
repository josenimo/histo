# Proposed ruff.toml, lands in Phase 1 alongside .pre-commit-config.yaml.
# Scoped to bin/ only; nothing else in the pipeline is Python.

line-length = 110
target-version = "py311" # TODO: match the Python in the sopa container

[lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes: unused imports, unused variables, undefined names
    "W", # pycodestyle warnings
    "B", # flake8-bugbear: likely bugs, mutable defaults, loop-variable binding
    "S", # flake8-bandit: security. S602/S604 flag subprocess with shell=True,
    #    which is the run_coreograph.py defect.
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # prefer pathlib over os.path
    "RET", # flake8-return
    "ARG", # unused function arguments
]

ignore = [
    "E501", # line length is handled by ruff-format
    "S101", # bare assert. Fine in test helpers, and see per-file-ignores below.
]

[lint.per-file-ignores]
# Test helpers legitimately assert, shell out to the pipeline, and read whole
# tiny fixtures. Keep them linted, but not against production rules.
"bin/test_*.py" = ["S101", "S602", "S603", "S604", "S607", "ARG"]

[format]
quote-style = "double"
