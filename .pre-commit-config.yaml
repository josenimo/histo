# Runner is `prek`, per the vendored nf-core AGENTS.md: stage changes, run prek,
# resolve all errors and all solvable warnings, repeat.
#
# The first three repos are what sopa:dev ships, kept verbatim so this file
# stays diffable against upstream. Everything marked ADDED is ours.
#
# Every custom hook maps to a defect found in the August 2026 review; the comment
# says which. If a hook stops earning its keep, delete it and say why in the
# commit message.
#
# Custom hooks use YAML folded scalars (>-), which collapse to a single line.
# Multi-line block scalars (|) in `entry:` are fragile in pre-commit, which
# shlex-splits the value. Hence the explicit `;` separators.

repos:
  # ---------------------------------------------------------------------------
  # Inherited from nf-core/sopa:dev. Do not diverge without reason.
  # ---------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.8.3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$

      # ADDED. Inputs are 5-100 GB. A stray fixture is painful to remove from
      # history. nf-core/tools 4.1.0 added an equivalent hook to the template.
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # main.nf carries `#!/usr/bin/env nextflow` but is not executable, and the
        # pristine nf-core TEMPLATE ships it the same way (100644). It is run via
        # `nextflow run`, never invoked directly. chmod +x would diverge from the
        # template and conflict at every sync, so exclude it instead.
        exclude: ^main\.nf$

  - repo: https://github.com/seqeralabs/nf-lint-pre-commit
    rev: v0.3.0
    hooks:
      - id: nextflow-lint
        files: '\.nf$|nextflow\.config$'
        args: ["-output", "json"]

  # ---------------------------------------------------------------------------
  # ADDED: Python. `bin/` is excluded by .prettierignore and had no linter at
  # all, which is where four of the five P0 defects lived. Enable ruff's S
  # (flake8-bandit) rules: S602/S604 flag subprocess with shell=True, which is
  # the run_coreograph.py defect.
  # ---------------------------------------------------------------------------

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0 # TODO: pin to current at merge time
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^bin/.*\.py$
      - id: ruff-format
        files: ^bin/.*\.py$

  # ---------------------------------------------------------------------------
  # ADDED: shell. submit_slurm.sh, run_coreograph_single_cycle.sh and
  # run_tests.sh were entirely unlinted.
  # ---------------------------------------------------------------------------

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0 # TODO: pin to current at merge time
    hooks:
      - id: shellcheck

  # ---------------------------------------------------------------------------
  # ADDED: custom guards. Nothing off the shelf catches these.
  # All five verified against the real repo; see the review notes.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      # Caught 8 occurrences of /fast/AG_Coscia/.../python_sopa.sif hardcoded in
      # sopa_spatial.nf module bodies, with the upstream directive commented out
      # above each. Verified 0 false positives against registry URIs
      # (docker.io/..., ghcr.io/...) and against sopa's singularity/docker ternary.
      # Cluster paths belong in conf/mdc.config.
      - id: no-absolute-container-paths
        name: no absolute filesystem paths in container directives
        language: system
        files: '\.(nf|config)$'
        entry: >-
          bash -c 'fail=0; for f in "$@"; do
          if grep -nE "^[[:space:]]*container[[:space:]]+.?/" "$f"; then
          echo "  ^ absolute container path in $f; put it in conf/mdc.config, not the module" >&2;
          fail=1; fi; done; exit $fail' --

      # Caught bin/run_coreograph.py invoking `docker run` via subprocess from
      # inside a Nextflow process, and bin/run_coreograph_single_cycle.sh.
      # There is no Docker daemon on the cluster, so that path always failed and
      # always reached a fallback that fabricated four corner crops as "cores".
      - id: no-nested-container-invocation
        name: no docker/podman/singularity invocation from inside the pipeline
        language: system
        files: '^(bin/|modules/|subworkflows/|workflows/).*\.(nf|py|sh)$'
        entry: >-
          bash -c 'fail=0; for f in "$@"; do
          if grep -nE "(docker|podman)[[:space:]]+run|(singularity|apptainer)[[:space:]]+exec" "$f"; then
          echo "  ^ nested container invocation in $f; Nextflow manages containers, declare one" >&2;
          fail=1; fi; done; exit $fail' --

      # Caught bin/convert_to_spatialdata.py using tifffile.imread on 5-100 GB
      # images, which defeated the reason for choosing sopa. Reads must be lazy.
      # test_* helpers are exempt: they work on tiny fixtures.
      - id: no-eager-image-reads
        name: no eager whole-image reads outside tests
        language: system
        files: '^bin/(?!test_).*\.py$'
        entry: >-
          bash -c 'fail=0; for f in "$@"; do
          if grep -nE "tifffile\.imread|imageio\.imread|skimage\.io\.imread" "$f"; then
          echo "  ^ eager image read in $f; use dask or tifffile aszarr" >&2;
          fail=1; fi; done; exit $fail' --

      # Revised 2026-08-06. Originally required a stub in every local module. That
      # encoded a rule that turned out to be wrong: five of sopa's eleven modules
      # mutate the SpatialData zarr in place and declare their input as their
      # output, so an empty stub would be pure ceremony. See AGENT_CONTEXT.md §7.
      #
      # Now requires a stub only where the module declares an output path that is
      # not also an input path, i.e. where it genuinely creates a file. Uses
      # `path "..."` and `path("...")` with a quoted literal as the signal for a
      # new file, since pass-through outputs are written as bare `path(var)`.
      - id: module-has-stub
        name: local modules that create files must have a stub block
        language: system
        files: '^modules/local/.*/main\.nf$'
        entry: >-
          bash -c 'fail=0; for f in "$@"; do
          creates=$(awk "/^[[:space:]]*output:/{o=1;next} /^[[:space:]]*(script|shell|exec|stub|when):/{o=0} o" "$f"
          | grep -cE "path[[:space:]]*\(?[\"]"); [ "${creates:-0}" -eq 0 ] && continue;
          grep -qE "^[[:space:]]*stub:" "$f" ||
          { echo "$f: declares $creates new output file(s) but has no stub: block" >&2; fail=1; };
          done; exit $fail' --

      # Caught: zero of twelve processes emitted versions.yml, so the pipeline had
      # no provenance record at all.
      #
      # Accepts either a versions.yml output or a `topic: versions` declaration,
      # because several vendored sopa modules use channel.topic("versions")
      # instead of emitting a file. Modules with genuinely neither go in
      # .lint-allow-no-versions, one path per line with a `#` reason above it.
      # That file is a burn-down list, not a permanent exemption.
      - id: module-emits-versions
        name: every local module records tool versions
        language: system
        files: '^modules/local/.*/main\.nf$'
        entry: >-
          bash -c 'fail=0; for f in "$@"; do
          if [ -f .lint-allow-no-versions ] && grep -v "^#" .lint-allow-no-versions | grep -qxF "$f";
          then continue; fi;
          grep -qE "versions\.yml|topic:[[:space:]]*versions" "$f" ||
          { echo "$f: no versions.yml and no versions topic" >&2; fail=1; }; done; exit $fail' --

      # The one hook targeting a failure mode where the test PASSES and the real
      # run fails, which is worse than no test. If a module's output: block
      # changes and its stub: block does not, the stub has rotted.
      #
      # Compares output and stub blocks between HEAD and the staged version.
      # New files are skipped; module-has-stub covers those.
      # Uses cksum, not md5sum: md5sum does not exist on macOS.
      #
      # Verified against five cases: no change (pass), output changed alone
      # (fail), output and stub both changed (pass), script-only change
      # (pass, no false positive), new untracked module (skipped).
      - id: stub-drift
        name: stub block must change when outputs change
        language: system
        files: '^modules/local/.*/main\.nf$'
        entry: >-
          bash -c 'ob() { awk "/^[[:space:]]*output:/{f=1;next}
          /^[[:space:]]*(script|shell|exec|stub|when):/{f=0} f"; };
          sb() { awk "/^[[:space:]]*stub:/{f=1;next} f"; }; fail=0;
          for f in "$@"; do old=$(git show "HEAD:$f" 2>/dev/null) || continue;
          new=$(cat "$f");
          oo=$(printf "%s" "$old" | ob | cksum); on=$(printf "%s" "$new" | ob | cksum);
          so=$(printf "%s" "$old" | sb | cksum); sn=$(printf "%s" "$new" | sb | cksum);
          if [ "$oo" != "$on" ] && [ "$so" = "$sn" ]; then
          echo "$f: output: block changed but stub: block did not; update the stub in this commit" >&2;
          fail=1; fi; done; exit $fail' --
